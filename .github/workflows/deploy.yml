name: CI-CD Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # ---------- LOGIN DOCKERHUB ----------
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------- BUILD BACKEND ----------
    - name: Build backend
      run: |
        docker build -t affancp/mean-backend:latest ./backend

    - name: Push backend
      run: docker push affancp/mean-backend:latest

    # ---------- BUILD FRONTEND ----------
    - name: Build frontend
      run: |
        docker build -t affancp/mean-frontend:latest ./frontend

    - name: Push frontend
      run: docker push affancp/mean-frontend:latest


    # ---------- DEPLOY TO EC2 ----------
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/mean-devops
          git pull
          docker compose pull
          docker compose up -d